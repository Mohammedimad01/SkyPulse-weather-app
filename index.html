<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPulse — Live Weather</title>
  <meta name="description"
    content="A beautiful, real-time weather application. Check current weather conditions for any city worldwide." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Animated background particles -->
  <div class="bg-particles" id="bgParticles"></div>

  <div class="app-container">
    <!-- Header / Brand -->
    <header class="app-header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <h1>SkyPulse</h1>
      </div>
      <p class="tagline">Real-time weather at your fingertips</p>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="text" id="cityInput" placeholder="Search any city…" autocomplete="off" spellcheck="false" />
        <button id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </div>
      <button id="locationBtn" class="location-btn" aria-label="Use my location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
        </svg>
        <span>Use my location</span>
      </button>
    </div>

    <!-- Loading Spinner -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <p>Fetching weather data…</p>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="error-msg hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
      <p id="errorText">City not found. Please try again.</p>
    </div>

    <!-- Weather Card -->
    <main id="weatherCard" class="weather-card hidden">
      <div class="weather-card-inner">
        <!-- Top: City & Date -->
        <div class="card-header">
          <div>
            <h2 id="cityName" class="city-name">—</h2>
            <p id="dateTime" class="date-time">—</p>
          </div>
          <button id="unitToggle" class="unit-toggle" aria-label="Toggle temperature unit">°C | °F</button>
        </div>

        <!-- Center: Icon & Temp -->
        <div class="card-main">
          <img id="weatherIcon" class="weather-icon" src="" alt="Weather icon" />
          <div class="temp-group">
            <span id="temperature" class="temperature">—</span>
            <span id="unitLabel" class="unit-label">°C</span>
          </div>
          <p id="weatherDesc" class="weather-desc">—</p>
        </div>

        <!-- Bottom: Details Grid -->
        <div class="card-details">
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 2v6l3 3" />
              <circle cx="12" cy="14" r="8" />
            </svg>
            <div>
              <span class="detail-label">Feels Like</span>
              <span id="feelsLike" class="detail-value">—</span>
            </div>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
            </svg>
            <div>
              <span class="detail-label">Humidity</span>
              <span id="humidity" class="detail-value">—</span>
            </div>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2" />
            </svg>
            <div>
              <span class="detail-label">Wind</span>
              <span id="windSpeed" class="detail-value">—</span>
            </div>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v6l4 2" />
            </svg>
            <div>
              <span class="detail-label">Pressure</span>
              <span id="pressure" class="detail-value">—</span>
            </div>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
            </svg>
            <div>
              <span class="detail-label">Visibility</span>
              <span id="visibility" class="detail-value">—</span>
            </div>
          </div>
          <div class="detail-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M17 18a5 5 0 0 0-10 0" />
              <line x1="12" y1="9" x2="12" y2="2" />
              <line x1="4.22" y1="10.22" x2="5.64" y2="11.64" />
              <line x1="1" y1="18" x2="3" y2="18" />
              <line x1="21" y1="18" x2="23" y2="18" />
              <line x1="18.36" y1="11.64" x2="19.78" y2="10.22" />
            </svg>
            <div>
              <span class="detail-label">Sunrise / Sunset</span>
              <span id="sunriseSunset" class="detail-value">—</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>

</html>
